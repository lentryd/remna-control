# Example deployment next to the Remnawave panel: the container joins the
# panel's docker network and is served by its Traefik at https://$APP_DOMAIN/.
# Copy this file and .env.example (as .env) into a folder on the server,
# fill in .env and run `docker compose up -d`.
services:
    remna-control:
        image: ghcr.io/lentryd/remna-control:latest
        container_name: remna-control
        hostname: remna-control
        restart: unless-stopped
        ports:
            - '${HOST_PORT:-8080}:8080'
        env_file:
            - .env
        # Container-side values; they override the local ones from .env.
        environment:
            PORT: 8080
            DB_PATH: /data/remna-control.db
            ADDONS_CONFIG: /etc/remna-control/addons.yml
        volumes:
            - remna-control-data:/data
            # Optional add-ons file (e.g. subpage's); add-ons can also be
            # managed in the UI. A missing file means none.
            - ${ADDONS_FILE:-./addons.yml}:/etc/remna-control/addons.yml:ro
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/healthz']
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            - remnawave-network
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.remna-control.rule=Host(`${APP_DOMAIN}`)'
            - 'traefik.http.routers.remna-control.tls=true'
            - 'traefik.http.routers.remna-control.entrypoints=${TRAEFIK_ENTRYPOINTS:-web,websecure}'
            - 'traefik.http.routers.remna-control.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.services.remna-control.loadbalancer.server.port=8080'

volumes:
    remna-control-data:

networks:
    remnawave-network:
        name: ${REMNAWAVE_NETWORK:-remnawave-network}
        external: true
